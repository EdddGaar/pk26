<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscripción Oficial | Tu Peque Re-Corre Calaveritas de Azúcar 2026</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet" />

    <style>
        :root {
            --morado: #8E44AD;
            --naranja: #E94E1B;
            --azul: #1D71B8;
            --verde: #27AE60;
            --fondo: #f8fafc;
            --shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--fondo); 
            color: #333; 
            line-height: 1.6;
            padding: 20px 10px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 30px;
            padding: 35px 25px;
            box-shadow: var(--shadow);
            border: 2px solid rgba(142, 68, 173, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header img {
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 1.6rem;
            color: var(--morado);
            font-weight: 900;
            text-transform: uppercase;
        }

        .header p {
            font-size: 0.85rem;
            color: #666;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        .form-control {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--morado);
            box-shadow: 0 0 10px rgba(142, 68, 173, 0.15);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--morado) 0%, #9b59b6 100%);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 1rem;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(142, 68, 173, 0.3);
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(142, 68, 173, 0.4);
        }

        .category-badge {
            display: none;
            background: #f3e8ff;
            color: var(--morado);
            padding: 10px 15px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            margin-top: 8px;
            border: 1px solid #d8b4fe;
        }

        #msg-result {
            margin-top: 25px;
            text-align: center;
        }

        /* 🟢 TARJETA DE CONFIRMACIÓN Y CORREO */
        .confirm-card {
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 20px;
            padding: 25px;
            text-align: left;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .email-notice-box {
            text-align: center;
            padding: 20px;
            background: #f0fdf4;
            border: 2px dashed #27ae60;
            border-radius: 16px;
            margin: 20px 0;
            color: #14532d;
        }

        .email-notice-box h4 {
            font-size: 1.1rem;
            font-weight: 900;
            color: #27ae60;
            margin-bottom: 8px;
        }

        .checkin-notice {
            background-color: #fff8e1;
            border-left: 4px solid #ffa000;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: #7f5000;
            line-height: 1.4;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .data-table td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .btn-action-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-action {
            display: block;
            text-align: center;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 0.88rem;
            transition: transform 0.2s;
        }
        .btn-action:hover { transform: translateY(-2px); }
        .btn-wa { background: var(--verde); color: white; box-shadow: 0 8px 18px rgba(39, 174, 96, 0.3); }
        .btn-search { background: var(--azul); color: white; box-shadow: 0 8px 18px rgba(29, 113, 184, 0.3); }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.75rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="https://raw.githubusercontent.com/EdddGaar/pk26/ac26029600cee534b5388b1c495cb11f466e2fa5/mmail.png" alt="Banner Tu Peque Re-Corre 2026">
            <h1>Formulario de Inscripción</h1>
            <p>Tu Peque Re-Corre: Calaveritas de Azúcar 2026<br><strong>Domingo 1 de Noviembre, 2026 | Pista del IMSS, Toluca</strong></p>
        </div>

        <form id="regForm" onsubmit="procesarInscripcion(event)">
            
            <!-- 1. Nombre del Niño -->
            <div class="form-group">
                <label for="nombre">1. Nombre Completo del Participante (Niño/a) *</label>
                <input type="text" id="nombre" class="form-control" placeholder="Ej. Mateo Mercado García" required>
            </div>

            <!-- 2. Edad -->
            <div class="form-group">
                <label for="edad">2. Edad del Participante (4 a 15 años) *</label>
                <input type="number" id="edad" class="form-control" min="4" max="15" placeholder="Ej. 8" oninput="calcularCategoria()" required>
                <div id="catPreview" class="category-badge"></div>
            </div>

            <!-- 3. Discapacidad -->
            <div class="form-group">
                <label for="discapacidad">3. ¿Cuenta con alguna discapacidad o condición especial? *</label>
                <select id="discapacidad" class="form-control" onchange="toggleDiscapacidadDetalle()" required>
                    <option value="No">No</option>
                    <option value="Sí">Sí</option>
                </select>
            </div>

            <div class="form-group" id="groupDiscapacidadDetalle" style="display: none;">
                <label for="discapacidadDetalle">Especifique la condición o apoyo requerido:</label>
                <input type="text" id="discapacidadDetalle" class="form-control" placeholder="Ej. Motriz, Autismo, requiere apoyo de tutor">
            </div>

            <!-- 4. Nombre del Tutor -->
            <div class="form-group">
                <label for="tutor">4. Nombre Completo del Tutor Responsable *</label>
                <input type="text" id="tutor" class="form-control" placeholder="Ej. Edgar Mercado" required>
            </div>

            <!-- 5. Teléfono -->
            <div class="form-group">
                <label for="telefono">5. Teléfono de Contacto (10 dígitos) *</label>
                <input type="tel" id="telefono" class="form-control" pattern="[0-9]{10}" maxlength="10" placeholder="Ej. 7221234567" required>
            </div>

            <!-- 6. Correo Electrónico -->
            <div class="form-group">
                <label for="email">6. Correo Electrónico (Para recibir folio) *</label>
                <input type="email" id="email" class="form-control" placeholder="tu-correo@ejemplo.com" required>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">
                COMPLETAR INSCRIPCIÓN 🏃‍♂️✨
            </button>
        </form>

        <div id="msg-result"></div>

        <footer>
            RUNNING CLUB RE-CORRE TOLUCA | Causa Atlética y Social
        </footer>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzpZXjVUwHC8sChMmcspEq7XuUCAZgO6_qZQKr8NohTxAegGz_80Jut8Aa2qEXCz18E/exec";

        function getCategoryData(edad) {
            if (edad <= 6) return { cat: "VERDE (4 a 6 años)", dist: "100m" };
            if (edad <= 8) return { cat: "AMARILLO (7 a 8 años)", dist: "200m" };
            if (edad <= 10) return { cat: "AZUL (9 a 10 años)", dist: "400m" };
            if (edad <= 13) return { cat: "MORADO (11 a 13 años)", dist: "800m" };
            return { cat: "ROJO (14 a 15 años)", dist: "1,600m" };
        }

        function calcularCategoria() {
            const edad = parseInt(document.getElementById('edad').value);
            const badge = document.getElementById('catPreview');
            
            if (isNaN(edad) || edad < 4 || edad > 15) {
                badge.style.display = "none";
                return;
            }

            const info = getCategoryData(edad);
            badge.innerText = `Categoría: ${info.cat} • Distancia: ${info.dist}`;
            badge.style.display = "block";
        }

        function toggleDiscapacidadDetalle() {
            const discVal = document.getElementById('discapacidad').value;
            const groupDetail = document.getElementById('groupDiscapacidadDetalle');
            groupDetail.style.display = (discVal === "Sí") ? "block" : "none";
        }

        async function procesarInscripcion(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnSubmit');
            const msg = document.getElementById('msg-result');
            const form = document.getElementById('regForm');

            const discVal = document.getElementById('discapacidad').value;
            const discDetalle = document.getElementById('discapacidadDetalle').value;
            const discFinal = (discVal === "Sí" && discDetalle.trim() !== "") ? `Sí (${discDetalle.trim()})` : discVal;

            const nombreNiño = document.getElementById('nombre').value.trim();
            const edadNiño = parseInt(document.getElementById('edad').value);
            const tutorNiño = document.getElementById('tutor').value.trim();
            const telNiño = document.getElementById('telefono').value.trim();
            const emailUser = document.getElementById('email').value.trim();
            const catInfo = getCategoryData(edadNiño);

            const payload = {
                action: "registro",
                nombre: nombreNiño,
                edad: edadNiño,
                discapacidad: discFinal,
                tutor: tutorNiño,
                telefono: telNiño,
                email: emailUser
            };

            btn.disabled = true;
            btn.innerText = "ENVIANDO INSCRIPCIÓN... ⏱️";
            msg.innerHTML = "<p style='color:var(--azul); font-weight:700; text-align:center;'>Guardando registro en la base de datos...</p>";

            try {
                // Enviar datos POST a Google Apps Script
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                // Ocultar formulario y desplegar confirmación clara
                form.style.display = "none";
                msg.innerHTML = `
                    <div class="confirm-card">
                        <h2 style="color:var(--morado); text-align:center; font-size:1.4rem; margin-bottom:5px;">¡Inscripción Exitosa! 🎉</h2>
                        <h3 style="text-align:center; font-size:1rem; color:#555; font-weight:700; margin-bottom:15px;">Tu Peque Re-Corre Calaveritas de Azúcar 2026</h3>

                        <p style="font-size:0.95rem;">Hola <strong>${tutorNiño || "Tutor"}</strong>,</p>
                        <p style="font-size:0.9rem; color:#444; margin-top:5px;">
                            Hemos recibido correctamente la inscripción de <strong>${nombreNiño}</strong> para participar en la gran carrera infantil.
                        </p>

                        <!-- Aviso de Envío a Correo -->
                        <div class="email-notice-box">
                            <h4>📧 ¡Tu Folio Oficial Ha Sido Enviado!</h4>
                            <p style="font-size:0.88rem; margin-top:5px;">
                                Enviaremos tu comprobante con el número de folio asignado al correo:<br>
                                <strong>${emailUser}</strong>
                            </p>
                            <p style="font-size:0.8rem; color:#666; margin-top:8px;">
                                💡 <em>Si no lo encuentras en tu Bandeja de Entrada en 1 minuto, recuerda revisar tu carpeta de <strong>SPAM o Correo No Deseado</strong>.</em>
                            </p>
                        </div>

                        <!-- Indicaciones de Check-in -->
                        <div class="checkin-notice">
                            <strong>HORARIO DE CHECK-IN:</strong> Favor de presentarse a las <strong>07:45 AM</strong> el día del evento en la mesa de control con tu folio para realizar su check-in y recibir su paquete.
                        </div>

                        <!-- Tabla de Datos Oficial -->
                        <table class="data-table">
                            <tr>
                                <td><strong>Participante:</strong></td>
                                <td>${nombreNiño}</td>
                            </tr>
                            <tr>
                                <td><strong>Categoría:</strong></td>
                                <td>${catInfo.cat}</td>
                            </tr>
                            <tr>
                                <td><strong>Distancia:</strong></td>
                                <td>${catInfo.dist}</td>
                            </tr>
                            <tr>
                                <td><strong>Fecha:</strong></td>
                                <td>Domingo 1 de Noviembre de 2026</td>
                            </tr>
                            <tr>
                                <td><strong>Horario de Carrera:</strong></td>
                                <td>08:00 AM a 10:00 AM</td>
                            </tr>
                            <tr>
                                <td><strong>Lugar / Sede:</strong></td>
                                <td>Pista del IMSS, Toluca, Estado de México</td>
                            </tr>
                        </table>

                        <!-- Botones de Acción -->
                        <div class="btn-action-group">
                            <a href="index.html#buscar" class="btn-action btn-search">
                                BUSCAR / CONSULTAR MI FOLIO EN LA WEB 🔍
                            </a>
                            <a href="https://wa.me/525534421722?text=Hola,%20acabo%20de%20inscribir%20a%20${encodeURIComponent(nombreNiño)}%20y%20quiero%20confirmar%20mi%20folio" target="_blank" class="btn-action btn-wa">
                                CONSULTAR VÍA WHATSAPP BOT 📱
                            </a>
                        </div>
                    </div>
                `;
            } catch (err) {
                msg.innerHTML = "<p style='color:var(--naranja); font-weight:700; text-align:center;'>❌ Error de conexión al servidor. Revisa tu señal e intenta de nuevo.</p>";
                btn.disabled = false;
                btn.innerText = "COMPLETAR INSCRIPCIÓN 🏃‍♂️✨";
            }
        }
    </script>
</body>
</html>
