<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscripción Oficial | Tu Peque Re-Corre Calaveritas de Azúcar 2026</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet" />

    <style>
        :root {
            --morado: #8E44AD;
            --naranja: #E94E1B;
            --azul: #1D71B8;
            --verde: #27AE60;
            --fondo: #f8fafc;
            --shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--fondo); 
            color: #333; 
            line-height: 1.6;
            padding: 20px 10px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 30px;
            padding: 35px 25px;
            box-shadow: var(--shadow);
            border: 2px solid rgba(142, 68, 173, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header img {
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 1.6rem;
            color: var(--morado);
            font-weight: 900;
            text-transform: uppercase;
        }

        .header p {
            font-size: 0.85rem;
            color: #666;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        .form-control {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--morado);
            box-shadow: 0 0 10px rgba(142, 68, 173, 0.15);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--morado) 0%, #9b59b6 100%);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 1rem;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(142, 68, 173, 0.3);
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(142, 68, 173, 0.4);
        }

        .category-badge {
            display: none;
            background: #f3e8ff;
            color: var(--morado);
            padding: 10px 15px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            margin-top: 8px;
            border: 1px solid #d8b4fe;
        }

        #msg-result {
            margin-top: 25px;
            text-align: center;
        }

        .success-box {
            background: #f0fdf4;
            border: 2px dashed var(--verde);
            padding: 25px;
            border-radius: 20px;
            color: #166534;
            text-align: left;
        }

        .folio-highlight {
            font-size: 2.2rem;
            font-weight: 900;
            color: #c0392b;
            text-align: center;
            background: #fff;
            padding: 12px;
            border-radius: 15px;
            border: 2px dashed #c0392b;
            margin: 15px 0;
            letter-spacing: 2px;
        }

        .summary-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #bbf7d0;
            margin: 15px 0;
            font-size: 0.88rem;
            color: #333;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.75rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="https://raw.githubusercontent.com/EdddGaar/pk26/ac26029600cee534b5388b1c495cb11f466e2fa5/mmail.png" alt="Banner Tu Peque Re-Corre 2026">
            <h1>Formulario de Inscripción</h1>
            <p>Tu Peque Re-Corre: Calaveritas de Azúcar 2026<br><strong>Domingo 1 de Noviembre, 2026 | Pista del IMSS, Toluca</strong></p>
        </div>

        <form id="regForm" onsubmit="procesarInscripcion(event)">
            
            <!-- 1. Nombre del Niño -->
            <div class="form-group">
                <label for="nombre">1. Nombre Completo del Participante (Niño/a) *</label>
                <input type="text" id="nombre" class="form-control" placeholder="Ej. Mateo Mercado García" required>
            </div>

            <!-- 2. Edad -->
            <div class="form-group">
                <label for="edad">2. Edad del Participante (4 a 15 años) *</label>
                <input type="number" id="edad" class="form-control" min="4" max="15" placeholder="Ej. 8" oninput="calcularCategoria()" required>
                <div id="catPreview" class="category-badge"></div>
            </div>

            <!-- 3. Discapacidad -->
            <div class="form-group">
                <label for="discapacidad">3. ¿Cuenta con alguna discapacidad o condición especial? *</label>
                <select id="discapacidad" class="form-control" onchange="toggleDiscapacidadDetalle()" required>
                    <option value="No">No</option>
                    <option value="Sí">Sí</option>
                </select>
            </div>

            <div class="form-group" id="groupDiscapacidadDetalle" style="display: none;">
                <label for="discapacidadDetalle">Especifique la condición o apoyo requerido:</label>
                <input type="text" id="discapacidadDetalle" class="form-control" placeholder="Ej. Motriz, Autismo, requiere apoyo de tutor">
            </div>

            <!-- 4. Nombre del Tutor -->
            <div class="form-group">
                <label for="tutor">4. Nombre Completo del Tutor Responsable *</label>
                <input type="text" id="tutor" class="form-control" placeholder="Ej. Edgar Mercado" required>
            </div>

            <!-- 5. Teléfono -->
            <div class="form-group">
                <label for="telefono">5. Teléfono de Contacto (10 dígitos) *</label>
                <input type="tel" id="telefono" class="form-control" pattern="[0-9]{10}" maxlength="10" placeholder="Ej. 7221234567" required>
            </div>

            <!-- 6. Correo Electrónico -->
            <div class="form-group">
                <label for="email">6. Correo Electrónico (Para recibir folio) *</label>
                <input type="email" id="email" class="form-control" placeholder="tu-correo@ejemplo.com" required>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">
                COMPLETAR INSCRIPCIÓN 🏃‍♂️✨
            </button>
        </form>

        <div id="msg-result"></div>

        <footer>
            RUNNING CLUB RE-CORRE TOLUCA | Causa Atlética y Social
        </footer>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzpZXjVUwHC8sChMmcspEq7XuUCAZgO6_qZQKr8NohTxAegGz_80Jut8Aa2qEXCz18E/exec";

        function getCatText(edad) {
            if (edad <= 6) return "VERDE (4 a 6 años) • 100m";
            if (edad <= 8) return "AMARILLO (7 a 8 años) • 200m";
            if (edad <= 10) return "AZUL (9 a 10 años) • 400m";
            if (edad <= 13) return "MORADO (11 a 13 años) • 800m";
            return "ROJO (14 a 15 años) • 1600m";
        }

        function calcularCategoria() {
            const edad = parseInt(document.getElementById('edad').value);
            const badge = document.getElementById('catPreview');
            
            if (isNaN(edad) || edad < 4 || edad > 15) {
                badge.style.display = "none";
                return;
            }

            badge.innerText = "Categoría: " + getCatText(edad);
            badge.style.display = "block";
        }

        function toggleDiscapacidadDetalle() {
            const discVal = document.getElementById('discapacidad').value;
            const groupDetail = document.getElementById('groupDiscapacidadDetalle');
            groupDetail.style.display = (discVal === "Sí") ? "block" : "none";
        }

        async function procesarInscripcion(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnSubmit');
            const msg = document.getElementById('msg-result');
            const form = document.getElementById('regForm');

            const discVal = document.getElementById('discapacidad').value;
            const discDetalle = document.getElementById('discapacidadDetalle').value;
            const discFinal = (discVal === "Sí" && discDetalle.trim() !== "") ? `Sí (${discDetalle.trim()})` : discVal;

            const nombreNiño = document.getElementById('nombre').value.trim();
            const edadNiño = parseInt(document.getElementById('edad').value);
            const tutorNiño = document.getElementById('tutor').value.trim();
            const telNiño = document.getElementById('telefono').value.trim();
            const emailUser = document.getElementById('email').value.trim();
            const catInfo = getCatText(edadNiño);

            const payload = {
                action: "registro",
                nombre: nombreNiño,
                edad: edadNiño,
                discapacidad: discFinal,
                tutor: tutorNiño,
                telefono: telNiño,
                email: emailUser
            };

            btn.disabled = true;
            btn.innerText = "PROCESANDO REGISTRO... ⏱️";
            msg.innerHTML = "<p style='color:var(--azul); font-weight:700; text-align:center;'>Guardando inscripción y consultando tu folio asignado...</p>";

            try {
                // 1. Enviar el registro a Google Apps Script
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                // 2. Esperar 1.5 segundos para dar tiempo a que la fila se guarde en Google Sheets
                await new Promise(r => setTimeout(r, 1500));

                // 3. Consultar la API por GET para obtener el Folio en tiempo real
                let folioObtenido = "REGISTRADO";
                try {
                    const searchRes = await fetch(`${WEB_APP_URL}?action=buscar&query=${encodeURIComponent(emailUser)}`);
                    const searchData = await searchRes.json();
                    
                    if (searchData.success && searchData.data && searchData.data.length > 0) {
                        // Buscar la coincidencia por nombre o tomar el último registrado
                        const match = searchData.data.find(item => item.nombre.toLowerCase().includes(nombreNiño.toLowerCase())) || searchData.data[searchData.data.length - 1];
                        if (match && match.folio) {
                            folioObtenido = match.folio;
                        }
                    }
                } catch (e) {
                    console.log("No se pudo obtener el folio por GET, se muestra mensaje estándar");
                }

                // 4. Mostrar resultado con el Folio destacado
                form.style.display = "none";
                msg.innerHTML = `
                    <div class="success-box">
                        <h2 style="text-align:center;">¡Inscripción Exitosa! 🎉</h2>
                        <p style="text-align:center; font-size:0.9rem; margin-top:5px;">
                            Tu registro se ha completado correctamente en el sistema.
                        </p>
                        
                        <div class="folio-highlight">
                            FOLIO: ${folioObtenido}
                        </div>

                        <div class="summary-card">
                            <strong>Resumen del Registro:</strong><br>
                            👤 <strong>Participante:</strong> ${nombreNiño}<br>
                            🎽 <strong>Categoría:</strong> ${catInfo}<br>
                            👨‍👩‍👧 <strong>Tutor:</strong> ${tutorNiño}<br>
                            📱 <strong>Teléfono:</strong> ${telNiño}<br>
                            📧 <strong>Correo:</strong> ${emailUser}
                        </div>

                        <div style="text-align:center; font-size:0.9rem; font-weight:900; color:#27ae60; margin:15px 0;">
                            ✅ Pase digital enviado a tu correo (Inbox)
                        </div>
                        
                        <p style="font-size:0.8rem; color:#555; margin-bottom:15px; text-align:center;">
                            Favor de presentarse a las <strong>07:45 AM</strong> el día del evento en la mesa de control de la Pista del IMSS con este número de folio.
                        </p>

                        <div style="text-align:center;">
                            <a href="https://wa.me/525534421722?text=Hola,%20mi%20folio%20es%20${folioObtenido}%20para%20${encodeURIComponent(nombreNiño)}" style="display:inline-block; background:var(--verde); color:white; text-decoration:none; padding:12px 25px; border-radius:30px; font-weight:700; font-size:0.85rem;">
                                IR A WHATSAPP CON MI FOLIO 📱
                            </a>
                        </div>
                    </div>
                `;
            } catch (err) {
                msg.innerHTML = "<p style='color:var(--naranja); font-weight:700; text-align:center;'>❌ Error de conexión al servidor. Revisa tu señal e intenta de nuevo.</p>";
                btn.disabled = false;
                btn.innerText = "COMPLETAR INSCRIPCIÓN 🏃‍♂️✨";
            }
        }
    </script>
</body>
</html>
